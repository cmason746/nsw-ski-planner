AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  NSW ski-weekend planner — serverless backend: a scheduled ingest Lambda that caches
  conditions in DynamoDB, and an API Lambda (behind an HTTP API) that serves the
  overview and the ranked recommendation, with the "why" prose generated by Claude
  Haiku 4.5 on Amazon Bedrock.

Parameters:
  IngestSchedule:
    Type: String
    Default: rate(3 hours)
    Description: How often the ingest Lambda refreshes cached conditions.
  BedrockModelId:
    Type: String
    Default: au.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: >
      Bedrock model id (or inference-profile id) used for the recommendation "why"
      prose. Confirm the exact value on the model's card in the Bedrock console for
      this region.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 30
    Environment:
      Variables:
        CONDITIONS_TABLE: !Ref ConditionsTable

Resources:
  # Cache of latest conditions — one item per resort, keyed by resort.
  ConditionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: resort
          AttributeType: S
      KeySchema:
        - AttributeName: resort
          KeyType: HASH

  # shared/ (resort data + factor scoring), reused by both Lambdas.
  SharedLayer:
    Type: AWS::Serverless::LayerVersion
    Metadata:
      BuildMethod: makefile
    Properties:
      LayerName: ski-shared
      Description: Shared resort data and factor scoring.
      ContentUri: backend/shared/
      CompatibleRuntimes:
        - python3.12

  # Scheduled ingest: fetch Open-Meteo + OnTheSnow, write the cache.
  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/ingest/
      Handler: handler.lambda_handler
      Timeout: 60
      Layers:
        - !Ref SharedLayer
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ConditionsTable
      Events:
        Timer:
          Type: Schedule
          Properties:
            Schedule: !Ref IngestSchedule

  # Request path: GET /conditions (overview) and POST /recommend (scored + prose).
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/api/
      Handler: handler.lambda_handler
      Timeout: 29
      MemorySize: 512
      Layers:
        - !Ref SharedLayer
      Environment:
        Variables:
          BEDROCK_REGION: !Ref AWS::Region
          BEDROCK_MODEL_ID: !Ref BedrockModelId
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref ConditionsTable
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              # Broad for the first deploy; scope to the model / inference-profile
              # ARN once we've confirmed exactly what the invoke resolves to.
              Resource: '*'
      Events:
        GetConditions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /conditions
        PostRecommend:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /recommend

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # Locked to the S3 website origin that serves the SPA (see SiteBucket).
        AllowOrigins:
          - !GetAtt SiteBucket.WebsiteURL
        AllowMethods:
          - GET
          - POST
        AllowHeaders:
          - '*'

  # Static website hosting for the built React SPA (frontend/dist).
  # Plain S3 website hosting (HTTP only, public-read) — no CloudFront. The bucket
  # contents are uploaded out-of-band with `aws s3 sync` after each deploy; SAM
  # only provisions the bucket, not its objects.
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: nsw-snowbound
      WebsiteConfiguration:
        IndexDocument: index.html
        # SPA fallback: unknown paths return index.html so client-side routing works.
        ErrorDocument: index.html
      # Public-read website hosting requires disabling the account/bucket public-access
      # blocks and allowing a public bucket policy (below).
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  # Allow anonymous GETs on the site objects (required for website hosting).
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'

Outputs:
  ApiBaseUrl:
    Description: HTTP API base URL — append /conditions or /recommend.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  ConditionsTableName:
    Description: DynamoDB conditions table name.
    Value: !Ref ConditionsTable
  SiteBucketName:
    Description: S3 bucket holding the built SPA — `aws s3 sync frontend/dist` here.
    Value: !Ref SiteBucket
  SiteUrl:
    Description: Public S3 static-website URL for the frontend.
    Value: !GetAtt SiteBucket.WebsiteURL
